<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title></title>
  </head>
  <body>
    <div class="container">
      <div class="card-container">
        <div class="result-card">
          <h3>Your Result</h3>
          <div class="percentage">
            <span>76</span>
            <p>of 100</p>
          </div>
          <h2>Great</h2>
          <p class="info">
            You scored higher than 65% of the people who have taken thest tests.
          </p>
        </div>
        <div class="summary">
          <h3>Summary</h3>
          <div class="col">
            <div class="cols col-1">
              <span>
                <img src="assets/images/icon-reaction.svg" alt="reaction" />
                Reaction
              </span>
              <p>80 <span class="full-mark">/ 100</span></p>
            </div>
            <div class="cols col-2">
              <span>
                <img
                  src="assets/images/icon-memory.svg"
                  alt="icon-memory"
                />Memory</span
              >
              <p>92<span class="full-mark">/ 100</span></p>
            </div>
            <div class="cols col-3">
              <span>
                <img
                  src="assets/images/icon-verbal.svg"
                  alt="verbal"
                />Verbal</span
              >
              <p>61<span class="full-mark">/ 100</span></p>
            </div>
            <div class="cols col-4">
              <span>
                <img
                  src="assets/images/icon-visual.svg"
                  alt="visual"
                />Verbal</span
              >
              <p>72 <span class="full-mark">/ 100</span></p>
            </div>
            <button type="submit">Continue</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
